<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NexLink — P2P Messenger</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    /* ── Reset & Base ─────────────────────────────── */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg:       #080b10;
      --surface:  #0d1117;
      --border:   #1c2333;
      --border2:  #243047;
      --accent:   #3b82f6;
      --accent2:  #1d4ed8;
      --green:    #22c55e;
      --red:      #ef4444;
      --yellow:   #f59e0b;
      --text:     #e2e8f0;
      --muted:    #64748b;
      --dim:      #334155;
      --font-ui:  'Syne', sans-serif;
      --font-mono:'JetBrains Mono', monospace;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-ui);
      overflow: hidden;
    }

    /* ── Layout ───────────────────────────────────── */
    #app {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* Grid background */
    #app::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 40px 40px;
      opacity: 0.3;
      pointer-events: none;
    }

    .view {
      width: 100%;
      max-width: 440px;
      padding: 20px;
      position: relative;
      z-index: 1;
      animation: fadeUp 0.3s ease;
    }

    .view.hidden { display: none !important; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Card ─────────────────────────────────────── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: 12px;
      padding: 32px;
      box-shadow: 0 0 0 1px rgba(59,130,246,0.05),
                  0 24px 48px rgba(0,0,0,0.5);
    }

    /* ── Brand ────────────────────────────────────── */
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
    }

    .brand-icon {
      width: 36px; height: 36px;
      background: var(--accent);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
    }

    .brand-name {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--text);
    }

    .brand-tag {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--accent);
      background: rgba(59,130,246,0.1);
      border: 1px solid rgba(59,130,246,0.2);
      padding: 2px 7px;
      border-radius: 4px;
      letter-spacing: 0.05em;
    }

    /* ── Typography ───────────────────────────────── */
    .section-title {
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .hint {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.5;
    }

    /* ── Form Elements ────────────────────────────── */
    .field {
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-bottom: 6px;
    }

    input[type="text"] {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border2);
      border-radius: 8px;
      padding: 11px 14px;
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]::placeholder { color: var(--dim); }
    input[type="text"]:focus { border-color: var(--accent); }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 11px 18px;
      font-family: var(--font-ui);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      white-space: nowrap;
    }

    .btn:hover  { background: #2563eb; }
    .btn:active { transform: scale(0.97); }

    .btn-full { width: 100%; justify-content: center; }

    .btn-ghost {
      background: transparent;
      border: 1px solid var(--border2);
      color: var(--text);
    }
    .btn-ghost:hover { background: var(--border); }

    .btn-sm {
      padding: 6px 12px;
      font-size: 12px;
      border-radius: 6px;
    }

    .btn-danger { background: var(--red); }
    .btn-danger:hover { background: #dc2626; }

    /* ── Hash Display ─────────────────────────────── */
    .hash-block {
      background: var(--bg);
      border: 1px solid var(--border2);
      border-radius: 8px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 20px;
    }

    .hash-val {
      font-family: var(--font-mono);
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: var(--accent);
    }

    /* ── Status Badge ─────────────────────────────── */
    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
    }

    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--dim);
      flex-shrink: 0;
    }

    .dot.green { background: var(--green); box-shadow: 0 0 6px var(--green); }
    .dot.red   { background: var(--red);   box-shadow: 0 0 6px var(--red); }
    .dot.yellow{ background: var(--yellow);box-shadow: 0 0 6px var(--yellow); }

    .status-text {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--muted);
    }

    /* ── Connect Row ──────────────────────────────── */
    .connect-row {
      display: flex;
      gap: 8px;
    }

    .connect-row input { margin-bottom: 0; flex: 1; }

    /* ── Connect Result ───────────────────────────── */
    #connect-status {
      margin-top: 12px;
      font-family: var(--font-mono);
      font-size: 12px;
      padding: 8px 12px;
      border-radius: 6px;
      display: none;
    }

    #connect-status.show { display: block; }
    #connect-status.ok   { color: var(--green); background: rgba(34,197,94,0.08); border: 1px solid rgba(34,197,94,0.2); }
    #connect-status.err  { color: var(--red);   background: rgba(239,68,68,0.08);  border: 1px solid rgba(239,68,68,0.2); }
    #connect-status.info { color: var(--yellow);background: rgba(245,158,11,0.08); border: 1px solid rgba(245,158,11,0.2); }

    /* ── Divider ──────────────────────────────────── */
    .divider {
      height: 1px;
      background: var(--border2);
      margin: 22px 0;
    }

    /* ── User Info Row ────────────────────────────── */
    .user-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .user-greeting {
      font-size: 13px;
      color: var(--muted);
    }
    .user-greeting strong { color: var(--text); }

    /* ── Chat View ─────────────────────────────────── */
    #view-chat {
      max-width: 100%;
      padding: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    #view-chat.hidden { display: none !important; }

    .chat-topbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--border2);
      flex-shrink: 0;
      position: relative;
      z-index: 2;
    }

    .chat-peer {
      flex: 1;
    }

    .chat-peer-name {
      font-size: 15px;
      font-weight: 600;
    }

    .chat-peer-hash {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--muted);
      margin-top: 1px;
    }

    .p2p-badge {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.05em;
      padding: 3px 8px;
      border-radius: 4px;
      background: rgba(34,197,94,0.1);
      color: var(--green);
      border: 1px solid rgba(34,197,94,0.25);
    }

    /* ── Messages ─────────────────────────────────── */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    #messages::-webkit-scrollbar { width: 4px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

    .msg {
      max-width: 72%;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .msg-me   { align-self: flex-end; align-items: flex-end; }
    .msg-them { align-self: flex-start; align-items: flex-start; }
    .msg-sys  { align-self: center; max-width: 100%; }

    .msg-name {
      font-size: 11px;
      color: var(--muted);
      font-weight: 600;
      padding: 0 4px;
    }

    .msg-bubble {
      padding: 9px 14px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.45;
      word-break: break-word;
    }

    .msg-me   .msg-bubble { background: var(--accent); color: #fff; border-bottom-right-radius: 3px; }
    .msg-them .msg-bubble { background: var(--surface); border: 1px solid var(--border2); border-bottom-left-radius: 3px; }
    .msg-sys  .msg-bubble {
      background: rgba(245,158,11,0.06);
      border: 1px solid rgba(245,158,11,0.15);
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: 11px;
      text-align: center;
    }

    .msg-time {
      font-size: 10px;
      color: var(--dim);
      font-family: var(--font-mono);
      padding: 0 4px;
    }

    /* ── Chat Input ───────────────────────────────── */
    .chat-footer {
      display: flex;
      gap: 10px;
      padding: 14px 20px;
      background: var(--surface);
      border-top: 1px solid var(--border2);
      flex-shrink: 0;
    }

    .chat-footer input { margin-bottom: 0; flex: 1; }

    /* ── Incoming Modal ────────────────────────────── */
    #incoming-modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      backdrop-filter: blur(4px);
    }

    #incoming-modal.hidden { display: none; }

    .modal-card {
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: 14px;
      padding: 28px;
      width: 320px;
      text-align: center;
      box-shadow: 0 24px 64px rgba(0,0,0,0.6);
      animation: fadeUp 0.25s ease;
    }

    .modal-icon { font-size: 36px; margin-bottom: 14px; }
    .modal-title { font-size: 17px; font-weight: 700; margin-bottom: 6px; }
    .modal-hash {
      font-family: var(--font-mono);
      font-size: 14px;
      color: var(--accent);
      margin-bottom: 20px;
    }

    .modal-actions { display: flex; gap: 10px; }
    .modal-actions .btn { flex: 1; justify-content: center; }

    /* ── Scrollbar global ─────────────────────────── */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }
  </style>
</head>
<body>
<div id="app">

  <!-- ══════════════════════════════
       VIEW: REGISTER
  ══════════════════════════════ -->
  <div id="view-register" class="view">
    <div class="card">
      <div class="brand">
        <div class="brand-icon">⚡</div>
        <span class="brand-name">NexLink</span>
        <span class="brand-tag">P2P</span>
      </div>

      <p class="hint" style="margin-bottom:24px">
        Buat akun lokal sekali, lalu bagikan kode hash kamu ke teman.<br>
        <strong style="color:var(--text)">Tidak ada server, tidak ada data tersimpan.</strong>
      </p>

      <div class="field">
        <label>Nama Kamu</label>
        <input id="reg-name" type="text" placeholder="contoh: Reza" maxlength="32" />
      </div>

      <button class="btn btn-full" id="btn-create">
        ⚡ Buat Akun &amp; Mulai
      </button>
    </div>
  </div>

  <!-- ══════════════════════════════
       VIEW: DASHBOARD
  ══════════════════════════════ -->
  <div id="view-dashboard" class="view hidden">
    <div class="card">
      <div class="brand" style="margin-bottom:20px">
        <div class="brand-icon">⚡</div>
        <span class="brand-name">NexLink</span>
        <span class="brand-tag">P2P</span>
      </div>

      <div class="user-row">
        <div class="user-greeting">Halo, <strong id="user-name"></strong></div>
        <div class="status-row" style="margin:0">
          <div class="dot" id="ws-dot"></div>
          <span class="status-text" id="ws-status">Menghubungkan...</span>
        </div>
      </div>

      <div class="section-title">Kode Hash Kamu</div>
      <div class="hash-block">
        <span class="hash-val" id="my-hash"></span>
        <button class="btn btn-ghost btn-sm" id="btn-copy">Salin</button>
      </div>

      <div class="divider"></div>

      <div class="section-title" style="margin-bottom:10px">Hubungi Teman</div>
      <div class="connect-row">
        <input id="target-hash" type="text" placeholder="Masukkan kode hash..." maxlength="8" autocomplete="off" />
        <button class="btn" id="btn-connect">Cari</button>
      </div>
      <div id="connect-status"></div>

      <div class="divider"></div>

      <button class="btn btn-ghost btn-sm" id="btn-logout" style="font-size:12px;color:var(--muted)">
        🔄 Reset Akun
      </button>
    </div>
  </div>

  <!-- ══════════════════════════════
       VIEW: CHAT (P2P)
  ══════════════════════════════ -->
  <div id="view-chat" class="view hidden">
    <div class="chat-topbar">
      <button class="btn btn-ghost btn-sm" id="btn-back">←</button>
      <div class="chat-peer">
        <div class="chat-peer-name" id="peer-name">—</div>
        <div class="chat-peer-hash" id="peer-hash-display"></div>
      </div>
      <span class="p2p-badge" id="p2p-badge">⏳ Connecting</span>
    </div>

    <div id="messages"></div>

    <div class="chat-footer">
      <input id="msg-input" type="text" placeholder="Ketik pesan..." autocomplete="off" disabled />
      <button class="btn" id="btn-send" disabled>Kirim</button>
    </div>
  </div>

  <!-- ══════════════════════════════
       MODAL: INCOMING CALL
  ══════════════════════════════ -->
  <div id="incoming-modal" class="hidden">
    <div class="modal-card">
      <div class="modal-icon">📡</div>
      <div class="modal-title">Permintaan Koneksi</div>
      <div class="modal-hash" id="modal-peer-hash"></div>
      <div class="modal-actions">
        <button class="btn btn-danger" id="btn-reject">Tolak</button>
        <button class="btn" id="btn-accept">Terima ✓</button>
      </div>
    </div>
  </div>

</div>

<script>
// ════════════════════════════════════════════════════════════
//  CONFIG — Ganti dengan URL Worker kamu setelah deploy
// ════════════════════════════════════════════════════════════
const WORKER_URL = 'wss://socket-signalling.YOUR_SUBDOMAIN.workers.dev';

const ICE_SERVERS = [
  { urls: 'stun:stun.l.google.com:19302' },
  { urls: 'stun:stun1.l.google.com:19302' },
  { urls: 'stun:stun2.l.google.com:19302' },
];

// ════════════════════════════════════════════════════════════
//  STATE
// ════════════════════════════════════════════════════════════
let account         = null;   // { name, hash }
let ws              = null;   // WebSocket → Worker
let wsReady         = false;
let pc              = null;   // RTCPeerConnection
let dc              = null;   // RTCDataChannel
let peerHash        = null;   // hash teman saat ini
let peerName        = null;   // nama teman saat ini
let pendingCandidates = [];
let pingTimer       = null;
let reconnectTimer  = null;

// Incoming offer yang menunggu keputusan user
let pendingOffer    = null;

// ════════════════════════════════════════════════════════════
//  ACCOUNT
// ════════════════════════════════════════════════════════════
function loadAccount() {
  try { return JSON.parse(localStorage.getItem('nexlink_account')); }
  catch { return null; }
}

function saveAccount(acc) {
  localStorage.setItem('nexlink_account', JSON.stringify(acc));
}

function generateHash() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const arr   = new Uint8Array(8);
  crypto.getRandomValues(arr);
  return [...arr].map(b => chars[b % chars.length]).join('');
}

// ════════════════════════════════════════════════════════════
//  WEBSOCKET / SIGNALING
// ════════════════════════════════════════════════════════════
function connectWS() {
  clearTimeout(reconnectTimer);
  if (ws && ws.readyState <= 1) return;

  setWsStatus('connecting');

  ws = new WebSocket(WORKER_URL);

  ws.onopen = () => {
    wsReady = true;
    ws.send(JSON.stringify({ type: 'register', hash: account.hash, name: account.name }));
    setWsStatus('online');
    startPing();
  };

  ws.onmessage = (e) => {
    try { handleSignal(JSON.parse(e.data)); }
    catch {}
  };

  ws.onclose = () => {
    wsReady = false;
    clearInterval(pingTimer);
    setWsStatus('offline');
    reconnectTimer = setTimeout(connectWS, 4000);
  };

  ws.onerror = () => ws.close();
}

function wsSend(msg) {
  if (ws?.readyState === WebSocket.OPEN) ws.send(JSON.stringify(msg));
}

function startPing() {
  clearInterval(pingTimer);
  pingTimer = setInterval(() => wsSend({ type: 'ping' }), 25_000);
}

// ════════════════════════════════════════════════════════════
//  SIGNAL HANDLER
// ════════════════════════════════════════════════════════════
async function handleSignal(msg) {
  switch (msg.type) {

    case 'registered':
      break;

    case 'lookup-result': {
      if (msg.online) {
        setConnectStatus('info', `⏳ Ditemukan! Memulai koneksi ke ${msg.hash}…`);
        await initiateOffer(msg.hash, msg.name || msg.hash);
      } else {
        setConnectStatus('err', `🔴 Pengguna ${msg.hash} sedang offline`);
      }
      break;
    }

    case 'offer': {
      // Ada yang mau konek → tampilkan modal
      pendingOffer = msg;
      showIncoming(msg.from, msg.name || msg.from);
      break;
    }

    case 'answer': {
      if (pc?.signalingState !== 'stable') {
        await pc.setRemoteDescription(new RTCSessionDescription(msg.sdp));
        flushCandidates();
      }
      break;
    }

    case 'ice-candidate': {
      const candidate = new RTCIceCandidate(msg.candidate);
      if (pc?.remoteDescription) {
        await pc.addIceCandidate(candidate);
      } else {
        pendingCandidates.push(candidate);
      }
      break;
    }

    case 'peer-offline': {
      setConnectStatus('err', `🔴 Peer ${msg.hash} offline`);
      closePeer();
      break;
    }

    case 'pong':
      break;
  }
}

// ════════════════════════════════════════════════════════════
//  WebRTC
// ════════════════════════════════════════════════════════════
function createPC(targetHash) {
  if (pc) { pc.close(); }
  peerHash = targetHash;
  pendingCandidates = [];

  pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });

  pc.onicecandidate = (e) => {
    if (e.candidate) wsSend({ type: 'ice-candidate', to: peerHash, candidate: e.candidate.toJSON() });
  };

  pc.onconnectionstatechange = () => {
    const s = pc.connectionState;
    if (s === 'connected') {
      onConnected();
    } else if (['disconnected', 'failed', 'closed'].includes(s)) {
      onDisconnected();
    }
  };

  pc.ondatachannel = (e) => setupDC(e.channel);

  return pc;
}

async function initiateOffer(targetHash, name) {
  peerName = name;
  createPC(targetHash);

  dc = pc.createDataChannel('chat', { ordered: true });
  setupDC(dc);

  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);

  wsSend({ type: 'offer', to: targetHash, sdp: pc.localDescription, name: account.name });
  openChatView(targetHash, name, false);
}

async function acceptOffer(msg) {
  peerName = msg.name || msg.from;
  createPC(msg.from);

  await pc.setRemoteDescription(new RTCSessionDescription(msg.sdp));
  flushCandidates();

  const answer = await pc.createAnswer();
  await pc.setLocalDescription(answer);

  wsSend({ type: 'answer', to: msg.from, sdp: pc.localDescription, name: account.name });
  openChatView(msg.from, peerName, false);
}

function setupDC(channel) {
  dc = channel;

  dc.onopen = () => {
    // Kirim handshake nama
    dc.send(JSON.stringify({ type: 'handshake', name: account.name }));
    onConnected();
  };

  dc.onmessage = (e) => {
    try {
      const data = JSON.parse(e.data);
      if (data.type === 'handshake') {
        peerName = data.name;
        document.getElementById('peer-name').textContent = data.name;
      } else if (data.type === 'msg') {
        appendMsg('them', data.content, data.name, data.time);
      }
    } catch {
      appendMsg('them', e.data, peerName || peerHash);
    }
  };

  dc.onclose = () => onDisconnected();
  dc.onerror = () => onDisconnected();
}

function flushCandidates() {
  pendingCandidates.forEach(c => pc?.addIceCandidate(c));
  pendingCandidates = [];
}

// ════════════════════════════════════════════════════════════
//  P2P EVENTS
// ════════════════════════════════════════════════════════════
function onConnected() {
  // Aktifkan input
  document.getElementById('msg-input').disabled  = false;
  document.getElementById('btn-send').disabled   = false;
  document.getElementById('msg-input').focus();

  const badge = document.getElementById('p2p-badge');
  badge.textContent = '🟢 P2P Direct';
  badge.style.background = 'rgba(34,197,94,0.1)';
  badge.style.color      = 'var(--green)';
  badge.style.borderColor= 'rgba(34,197,94,0.25)';

  appendMsg('sys', '✅ Koneksi P2P berhasil — End-to-End terenkripsi');
}

function onDisconnected() {
  appendMsg('sys', '⚠️ Koneksi terputus');
  document.getElementById('msg-input').disabled = true;
  document.getElementById('btn-send').disabled  = true;
  closePeer();
}

function closePeer() {
  dc?.close(); dc = null;
  pc?.close(); pc = null;
  peerHash = null;
  peerName = null;
  pendingCandidates = [];
}

// ════════════════════════════════════════════════════════════
//  UI
// ════════════════════════════════════════════════════════════
function showView(name) {
  document.querySelectorAll('.view').forEach(v => v.classList.add('hidden'));
  document.getElementById(`view-${name}`).classList.remove('hidden');
}

function setWsStatus(state) {
  const dot  = document.getElementById('ws-dot');
  const text = document.getElementById('ws-status');
  if (!dot) return;
  dot.className = 'dot';
  if (state === 'online') {
    dot.classList.add('green');
    text.textContent = 'Online';
  } else if (state === 'offline') {
    dot.classList.add('red');
    text.textContent = 'Offline — Reconnecting…';
  } else {
    dot.classList.add('yellow');
    text.textContent = 'Menghubungkan…';
  }
}

function setConnectStatus(type, text) {
  const el = document.getElementById('connect-status');
  el.textContent = text;
  el.className   = `show ${type}`;
}

function openChatView(hash, name, activated) {
  document.getElementById('peer-name').textContent        = name || hash;
  document.getElementById('peer-hash-display').textContent= hash;
  document.getElementById('messages').innerHTML           = '';
  document.getElementById('msg-input').disabled           = true;
  document.getElementById('btn-send').disabled            = true;
  document.getElementById('p2p-badge').textContent        = '⏳ Connecting…';
  document.getElementById('p2p-badge').style.color        = 'var(--yellow)';
  document.getElementById('p2p-badge').style.borderColor  = 'rgba(245,158,11,0.25)';
  document.getElementById('p2p-badge').style.background   = 'rgba(245,158,11,0.08)';
  showView('chat');
}

function showIncoming(hash, name) {
  document.getElementById('modal-peer-hash').textContent =
    `${name}  ·  ${hash}`;
  document.getElementById('incoming-modal').classList.remove('hidden');
}

function hideIncoming() {
  document.getElementById('incoming-modal').classList.add('hidden');
}

function appendMsg(from, content, name, time) {
  const wrap  = document.getElementById('messages');
  const div   = document.createElement('div');
  div.className = `msg msg-${from === 'me' ? 'me' : from === 'sys' ? 'sys' : 'them'}`;

  if (name && from !== 'me' && from !== 'sys') {
    const n = document.createElement('div');
    n.className = 'msg-name';
    n.textContent = name;
    div.appendChild(n);
  }

  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';
  bubble.textContent = content;
  div.appendChild(bubble);

  if (from !== 'sys') {
    const t = document.createElement('div');
    t.className = 'msg-time';
    t.textContent = time || new Date().toLocaleTimeString('id-ID', { hour:'2-digit', minute:'2-digit' });
    div.appendChild(t);
  }

  wrap.appendChild(div);
  wrap.scrollTop = wrap.scrollHeight;
}

function sendMessage() {
  const input   = document.getElementById('msg-input');
  const content = input.value.trim();
  if (!content || !dc || dc.readyState !== 'open') return;

  const time = new Date().toLocaleTimeString('id-ID', { hour:'2-digit', minute:'2-digit' });
  dc.send(JSON.stringify({ type: 'msg', content, name: account.name, time }));
  appendMsg('me', content, null, time);
  input.value = '';
}

// ════════════════════════════════════════════════════════════
//  INIT
// ════════════════════════════════════════════════════════════
document.addEventListener('DOMContentLoaded', () => {
  account = loadAccount();

  if (account) {
    document.getElementById('user-name').textContent = account.name;
    document.getElementById('my-hash').textContent   = account.hash;
    showView('dashboard');
    connectWS();
  } else {
    showView('register');
  }

  // ── Register ────────────────────────────────────
  document.getElementById('btn-create').addEventListener('click', () => {
    const name = document.getElementById('reg-name').value.trim();
    if (!name) { alert('Masukkan nama kamu dulu!'); return; }
    account = { name, hash: generateHash() };
    saveAccount(account);
    document.getElementById('user-name').textContent = account.name;
    document.getElementById('my-hash').textContent   = account.hash;
    showView('dashboard');
    connectWS();
  });

  document.getElementById('reg-name').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') document.getElementById('btn-create').click();
  });

  // ── Copy Hash ───────────────────────────────────
  document.getElementById('btn-copy').addEventListener('click', async () => {
    await navigator.clipboard.writeText(account.hash);
    const btn = document.getElementById('btn-copy');
    btn.textContent = '✓ Disalin';
    setTimeout(() => btn.textContent = 'Salin', 2000);
  });

  // ── Connect / Lookup ────────────────────────────
  document.getElementById('btn-connect').addEventListener('click', () => {
    const hash = document.getElementById('target-hash').value.trim().toUpperCase().replace(/[^A-Z0-9]/g,'');
    if (!hash || hash.length < 6) {
      setConnectStatus('err', '❌ Kode hash tidak valid');
      return;
    }
    if (hash === account.hash) {
      setConnectStatus('err', '❌ Tidak bisa konek ke diri sendiri');
      return;
    }
    if (!wsReady) {
      setConnectStatus('err', '🔴 Belum terhubung ke server');
      return;
    }
    setConnectStatus('info', `🔍 Mencari ${hash}…`);
    wsSend({ type: 'lookup', hash });
  });

  document.getElementById('target-hash').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') document.getElementById('btn-connect').click();
  });

  // ── Reset Akun ──────────────────────────────────
  document.getElementById('btn-logout').addEventListener('click', () => {
    if (!confirm('Reset akun? Kode hash kamu akan berubah.')) return;
    localStorage.removeItem('nexlink_account');
    ws?.close();
    location.reload();
  });

  // ── Chat: Kirim ─────────────────────────────────
  document.getElementById('btn-send').addEventListener('click', sendMessage);
  document.getElementById('msg-input').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') sendMessage();
  });

  // ── Chat: Kembali ────────────────────────────────
  document.getElementById('btn-back').addEventListener('click', () => {
    if (dc?.readyState === 'open') {
      if (!confirm('Putuskan koneksi?')) return;
    }
    closePeer();
    showView('dashboard');
    setConnectStatus('info', '↩ Koneksi diputus');
  });

  // ── Modal: Terima/Tolak ─────────────────────────
  document.getElementById('btn-accept').addEventListener('click', async () => {
    hideIncoming();
    if (pendingOffer) {
      await acceptOffer(pendingOffer);
      pendingOffer = null;
    }
  });

  document.getElementById('btn-reject').addEventListener('click', () => {
    hideIncoming();
    pendingOffer = null;
  });
});
</script>
</body>
</html>
